<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAEC - Landing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<script src="main.js"></script>
<body class="bg-white-100 min-h-screen flex flex-col">
  <!-- Barra superior -->
  <header class="shadow-md py-6 rounded-full" style="background-color: #e3d3e6;">
    <div class="flex justify-between items-center px-8">
      <h1 class="text-black text-2xl font-bold">RAEC</h1>
      <div class="flex items-center gap-4">
        <span id="user-welcome" class="text-black text-sm"></span>
        <button id="btn-logout" class="bg-red-300 text-black px-4 py-2 rounded-full hover:bg-red-400 transition font-bold">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="flex-grow flex items-center">
    <div class="flex flex-col space-y-4">
      <button id="btn-registrar" class="bg-purple-300 text-black px-12 py-6 rounded-r-full shadow hover:bg-purple-400 transition border border-black font-bold">
        ✔️ Registrar
      </button>
      <button id="btn-solicitudes" class="bg-purple-300 text-black px-12 py-6 rounded-r-full shadow hover:bg-purple-400 transition border border-black font-bold">
        ✔️ Solicitudes
      </button>
      <button id="btn-reportes" class="bg-purple-300 text-black px-12 py-6 rounded-r-full shadow hover:bg-purple-400 transition border border-black font-bold">
        ✔️ Reportes
      </button>
    </div>
  </main>

  <script>
    // Verificar autenticación
    const accessToken = localStorage.getItem('access_token');
    const isAuthenticated = localStorage.getItem('isAuthenticated');
    
    if (!accessToken || !isAuthenticated) {
      window.location.href = 'login.html';
    }
    
    // Mostrar información del usuario
    const userData = localStorage.getItem('user_data');
    if (userData) {
      const user = JSON.parse(userData);
      document.getElementById('user-welcome').textContent = user.message || 'Bienvenido';
    }
    
    // Función de logout
    document.getElementById('btn-logout').addEventListener('click', function() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('user_data');
      localStorage.removeItem('isAuthenticated');
      window.location.href = 'login.html';
    });
    
    // Función para ir al registro (React)
    document.getElementById('btn-registrar').addEventListener('click', function() {
      // Redirigir a la aplicación React manteniendo la autenticación
      window.location.href = 'http://localhost:5173/registrar';
    });
  </script>
</body>
</html>
