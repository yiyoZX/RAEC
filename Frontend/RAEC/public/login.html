<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAEC - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">


  <div class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6">

    <!-- Logo / Título -->
    <h1 class="text-2xl font-bold text-center text-black-500 mb-6">RAEC</h1>
    <h2 class="text-lg font-semibold text-center text-gray-700 mb-4">Iniciar sesión</h2>

    <!-- Formulario -->
    <form>
      <!-- Usuario -->
      <div class="mb-4">
        <label for="usuario" class="block text-gray-700 font-medium mb-1">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <!-- Contraseña -->
      <div class="mb-4">
        <label for="password" class="block text-gray-700 font-medium mb-1">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <!-- Botón -->
      <button type="submit"
        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
        Ingresar
      </button>
    </form>


  </div>

 <script src="login.js"></script> 
</body>
</html>
