<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>RAEC - Reportes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white-100 min-h-screen flex flex-col">
  <header class="shadow-md py-6 rounded-full" style="background-color:#e3d3e6;">
    <div class="flex justify-center">
      <h1 class="text-black text-2xl font-bold">RAEC</h1>
    </div>
  </header>

  <main class="flex-grow p-6">
    <div class="max-w-3xl mx-auto mt-6 flex items-start gap-6 flex-col md:flex-row">

      <button onclick="window.location.href='dashboard.html'"
        class="bg-gray-500 text-white px-4 py-2 rounded-lg shadow hover:bg-gray-600 transition font-bold border border-black">
        Volver
      </button>

      <div class="flex-1 w-full">
        <label for="reportes" class="block text-lg font-semibold text-gray-700 mb-2 text-center">
          Selecciona un tipo de reporte
        </label>
        <select id="reportes" class="w-full border border-gray-400 rounded-lg px-4 py-2 shadow">
          <option value="" selected disabled>-- Elige una opción --</option>
          <option value="alumno">Por alumno</option>
          <option value="actividad">Por actividad</option>
          <option value="general">General</option>
        </select>

        <input id="rut-input" type="text" placeholder="Ingrese RUT del alumno"
          class="w-full mt-4 border border-gray-400 rounded-lg px-4 py-2 shadow hidden">

        <!-- Select tipo de actividad (académica / no académica) -->
        <select id="actividad-tipo"
          class="w-full mt-4 border border-gray-400 rounded-lg px-4 py-2 shadow hidden">
          <option value="">Seleccione tipo de actividad</option>
          <option value="academica">Académica</option>
          <option value="no_academica">No Académica</option>
        </select>

        <!-- Select actividad específica -->
        <select id="actividad-selector"
          class="w-full mt-4 border border-gray-400 rounded-lg px-4 py-2 shadow hidden">
          <option value="">Seleccione una actividad</option>
        </select>

        <button id="consultar-btn"
          class="bg-purple-600 text-white px-4 py-2 rounded-lg shadow hover:bg-purple-700 transition font-bold border border-black mt-4 w-full hidden">
          Consultar
        </button>
      </div>
    </div>

    <div class="max-w-2xl mx-auto mt-8 p-6 border border-gray-300 rounded-lg shadow-md text-center"
         style="background-color:#f1e1f1;">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Preview del reporte</h2>
      <div id="preview-reporte" class="text-gray-600">
        Aquí se mostrará una vista previa del informe seleccionado.
      </div>
    </div>
  </main>

  <script src="reportes.js"></script>
</body>
</html>
