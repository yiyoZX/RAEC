<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAEC - Reportes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white-100 min-h-screen flex flex-col">

  <!-- Barra superior -->
  <header class="shadow-md py-6 rounded-full" style="background-color: #e3d3e6;">
    <div class="flex justify-center">
      <h1 class="text-black text-2xl font-bold">RAEC</h1>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="flex-grow p-6">

        <!-- Contenedor del botón Volver + selector -->
    <div class="max-w-3xl mx-auto mt-6 flex items-center justify-between gap-4">

    <!-- Botón Volver -->
    <button onclick="window.location.href='dashboard.html'" 
        class="bg-gray-500 text-white px-4 py-2 rounded-lg shadow hover:bg-gray-600 transition font-bold border border-black relative right-20 top-4">
        Volver
    </button>

    <!-- Selector de reportes -->
    <div class="flex-1">
        <label for="reportes" class="block text-lg font-semibold text-gray-700 mb-2 text-center">
        Selecciona un tipo de reporte
        </label>
        <select id="reportes" class="w-full border border-gray-400 rounded-lg px-4 py-2 shadow focus:ring-2 focus:ring-blue-500">
        <option value="" selected disabled>-- Elige una opción --</option>
        <option value="semestrales">Reportes semestrales</option>
        <option value="alumno">Por alumno</option>
        <option value="asignatura">Por asignatura</option>
        <option value="general">General</option>
        </select>
    </div>

    </div>


    <!-- Preview del reporte -->
    <div class="max-w-2xl mx-auto mt-8 p-6 border border-gray-300 rounded-lg shadow-md text-center" style="background-color: #f1e1f1;">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Preview del reporte</h2>
      <p class="text-gray-600">
        Aquí se mostrará una vista previa del informe seleccionado.
      </p>
    </div>

  </main>

</body>
</html>
