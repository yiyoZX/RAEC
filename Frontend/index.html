<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAEC - Landing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<script src="main.js"></script>
<body class="bg-white-100 min-h-screen flex flex-col">

  <!-- Barra superior -->
  <header class="shadow-md py-6 rounded-full" style="background-color: #e3d3e6;">
    <div class="flex justify-center">
      <h1 class="text-black text-2xl font-bold">RAEC</h1>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="flex-grow flex items-center">
    <div class="flex flex-col space-y-4">
      <button id="btn-registrar" class="bg-purple-300 text-black px-12 py-6 rounded-r-full shadow hover:bg-purple-400 transition border border-black font-bold">
        ✔️ Registrar
      </button>
      <button id="btn-solicitudes" class="bg-purple-300 text-black px-12 py-6 rounded-r-full shadow hover:bg-purple-400 transition border border-black font-bold">
        ✔️ Solicitudes
      </button>
      <button id="btn-reportes" class="bg-purple-300 text-black px-12 py-6 rounded-r-full shadow hover:bg-purple-400 transition border border-black font-bold">
        ✔️ Reportes
      </button>
    </div>
  </main>
</body>
</html>
